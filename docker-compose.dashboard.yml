name: destiny-dashboard

x-dashboard-environment: &dashboard-environment
  NODE_ENV: production
  PORT: "3000"
  DASHBOARD_PROCESS: "true"
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in .env}
  DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
  SERVER_DASHBOARD_ORIGIN: ${SERVER_DASHBOARD_ORIGIN:?Set SERVER_DASHBOARD_ORIGIN in .env}
  OWNER_DASHBOARD_ORIGIN: ${OWNER_DASHBOARD_ORIGIN:?Set OWNER_DASHBOARD_ORIGIN in .env}
  SERVER_DASHBOARD_SESSION_SECRET: ${SERVER_DASHBOARD_SESSION_SECRET:?Set SERVER_DASHBOARD_SESSION_SECRET in .env}
  OWNER_DASHBOARD_SESSION_SECRET: ${OWNER_DASHBOARD_SESSION_SECRET:?Set OWNER_DASHBOARD_SESSION_SECRET in .env}
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env}

services:
  server-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: destiny-dashboard:production
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      <<: *dashboard-environment
      DASHBOARD_APP: server
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');const host=new URL(process.env[process.env.DASHBOARD_APP.toUpperCase()+'_DASHBOARD_ORIGIN']).host;const r=h.get({host:'127.0.0.1',port:3000,path:'/health',headers:{host}},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  owner-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: destiny-dashboard:production
    command: ["node", "dist/src/dashboard/owner.js"]
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      <<: *dashboard-environment
      DASHBOARD_APP: owner
      BOT_OWNER_IDS: ${BOT_OWNER_IDS:?Set the root Discord user ID in BOT_OWNER_IDS in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');const host=new URL(process.env[process.env.DASHBOARD_APP.toUpperCase()+'_DASHBOARD_ORIGIN']).host;const r=h.get({host:'127.0.0.1',port:3000,path:'/health',headers:{host}},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
