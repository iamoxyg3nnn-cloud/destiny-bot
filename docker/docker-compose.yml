version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: destiny-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    container_name: destiny-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      RUN_SHARDS: "true"
      RUN_BOT: "true"
      RUN_API: "true"
      API_HOST: "0.0.0.0"
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: destiny-workers
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      RUN_WORKERS: "true"
      DISABLE_MATCHMAKING_WORKER: "true"
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: destiny-dashboard
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://bot:4000
    ports:
      - "3000:3000"
    depends_on:
      - bot

volumes:
  redis_data:
