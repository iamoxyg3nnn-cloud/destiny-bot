version: '3.8'

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    container_name: destiny-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      RUN_SHARDS: "true"
      RUN_BOT: "true"

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: destiny-workers
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      RUN_WORKERS: "true"
      DISABLE_MATCHMAKING_WORKER: "true"
