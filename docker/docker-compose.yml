version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: destiny-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    container_name: destiny-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RUN_SHARDS=true
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: destiny-workers
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RUN_WORKERS=true
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: destiny-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://bot:4000
    ports:
      - "3000:3000"
    depends_on:
      - bot

volumes:
  redis_data:
