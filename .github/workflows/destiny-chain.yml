name: Destiny Session Continuation

on:
  workflow_run:
    workflows:
      - Destiny Bot Runner
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: destiny-session-continuation
  cancel-in-progress: false

jobs:
  dispatch-successor:
    name: Start the next Destiny session
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Back off after an unsuccessful session
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "::warning::Previous Destiny run concluded as ${{ github.event.workflow_run.conclusion }}."
          echo "Waiting 3 minutes before starting a recovery session."
          sleep 180

      - name: Dispatch the next bot session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Previous run: ${{ github.event.workflow_run.html_url }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          gh workflow run destiny.yml \
            --repo "${GH_REPO}" \
            --ref main \
            -f session_minutes=345
          echo "::notice::Successor session dispatch accepted by GitHub Actions."

      - name: Verify successor run was created
        env:
          PREVIOUS_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh run list --repo "${GH_REPO}" --workflow destiny.yml --event workflow_dispatch --branch main --limit 20 --json number,status --jq 'any(.[]; .number > '"${PREVIOUS_RUN_NUMBER}"' and (.status == "queued" or .status == "in_progress"))' | grep -qx true; then
              echo "::notice::Verified that GitHub created the successor workflow run."
              exit 0
            fi
            echo "Waiting for GitHub to publish the dispatched run (attempt ${attempt}/6)..."
            sleep 5
          done
          echo "::error::Dispatch was accepted but no successor run appeared in the Actions queue."
          exit 1

      - name: Continuation summary
        if: always()
        run: |
          {
            echo "### Destiny session continuation"
            echo ""
            echo "- Previous run: [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }})"
            echo "- Previous conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "- Branch: main"
            echo "- Successor: dispatch requested"
          } >> "${GITHUB_STEP_SUMMARY}"
