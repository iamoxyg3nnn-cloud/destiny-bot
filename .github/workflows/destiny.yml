name: Destiny Bot Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes per session before chaining the next (max 350)"
        required: false
        default: "345"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: destiny-bot-runner
  # A separate workflow_run watcher dispatches only after this run completes.
  # Never cancel an active bot session when another trigger arrives.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    name: Run Destiny Ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      BOT_OWNER_IDS: ${{ secrets.BOT_OWNER_IDS }}
      DISCORD_SHARDS_TOTAL: ${{ secrets.DISCORD_SHARDS_TOTAL }}
      DISCORD_SHARDS_PER_CLUSTER: ${{ secrets.DISCORD_SHARDS_PER_CLUSTER }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMINDER_CRON_SCHEDULE: "30 19 * * *"
      REMINDER_DEFAULT_TIMEZONE: "Asia/Kolkata"
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      AUTO_MOD_ENABLED: "true"
      MAX_MESSAGE_RATE_PER_3S: "5"
      MAX_QUEUE_WAIT_SECONDS: "180"
      LOG_LEVEL: "info"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --prod=false

      - name: Build TypeScript Project
        run: pnpm run build

      - name: Check required runtime secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_OWNER_IDS: ${{ secrets.BOT_OWNER_IDS }}
        run: |
          set -euo pipefail
          missing=()
          for key in DISCORD_TOKEN DISCORD_CLIENT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BOT_OWNER_IDS; do
            if [ -z "${!key:-}" ]; then missing+=("${key}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions runtime secrets: %s. Add these under Settings > Secrets and variables > Actions, then enable the bot workflows.\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          echo "Required bot runtime secrets are configured."

      - name: Prepare Environment Configuration
        env:
          NODE_ENV: production
        run: |
          node scripts/setup-env.js
          chmod 0600 .env

      - name: Run Destiny Bot Session
        env:
          NODE_ENV: production
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          SESSION_MINUTES="${SESSION_MINUTES:-345}"
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "session_minutes must be an integer"; SESSION_MINUTES=345 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "Capping session to 350m (job limit is 360m)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "🌌 Launching Destiny bot session for ${SESSION_MINUTES}m (${seconds}s)..."

          set +e
          timeout --signal=INT --kill-after=90s "${seconds}s" pnpm start &
          bot_pid=$!
          set -e

            # No web dashboard or admin API is started in this bot workflow.

          # Wait for the bot session to finish, then honour its exit status.
          set +e
          wait "${bot_pid}"
          rc=$?
          set -e

          if [ "${rc}" -eq 124 ]; then
            echo "::notice::Session window ended cleanly after ${SESSION_MINUTES}m; completion watcher will start the next session."
            exit 0
          fi
          if [ "${rc}" -eq 0 ]; then
            echo "::notice::Destiny bot process stopped cleanly; completion watcher will start the next session."
            exit 0
          fi

          echo "::error::Destiny bot exited with status ${rc}; the completion watcher will start a recovery session."
          exit "${rc}"

      - name: Session Summary
        if: always()
        run: |
          {
            echo "### 🌌 Destiny Bot Session"
            echo ""
            echo "- **Status:** Session ended; completion watcher schedules the successor"
            echo "- **Runner:** ${RUNNER_NAME} (GitHub Actions Ubuntu)"
            echo "- **Runtime storage:** Supabase PostgreSQL"
          } >> "${GITHUB_STEP_SUMMARY}"
