name: Destiny Bot Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes per session before chaining the next (max 350)"
        required: false
        default: "345"
      admin_tunnel:
        description: "Also publish the admin console on a Cloudflare quick tunnel"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: destiny-bot-runner
  # Session chaining dispatches a successor before this run exits. Cancelling
  # the current run here would kill the session that just created the successor.
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    name: Run Destiny Ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_SHARDS_TOTAL: ${{ secrets.DISCORD_SHARDS_TOTAL }}
      DISCORD_SHARDS_PER_CLUSTER: ${{ secrets.DISCORD_SHARDS_PER_CLUSTER }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
      REDIS_USERNAME: ${{ secrets.REDIS_URL && secrets.REDIS_USERNAME || (secrets.REDIS_HOST && secrets.REDIS_HOST != '127.0.0.1' && secrets.REDIS_USERNAME) || '' }}
      REDIS_PASSWORD: ${{ secrets.REDIS_URL && secrets.REDIS_PASSWORD || (secrets.REDIS_HOST && secrets.REDIS_HOST != '127.0.0.1' && secrets.REDIS_PASSWORD) || '' }}
      REDIS_TOKEN: ${{ secrets.REDIS_URL && secrets.REDIS_TOKEN || (secrets.REDIS_HOST && secrets.REDIS_HOST != '127.0.0.1' && secrets.REDIS_TOKEN) || '' }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_DB: ${{ secrets.REDIS_DB || '0' }}
      REDIS_TLS: ${{ (secrets.REDIS_URL || (secrets.REDIS_HOST && secrets.REDIS_HOST != '127.0.0.1')) && secrets.REDIS_TLS || 'false' }}
      REDIS_KEY_PREFIX: "destiny:"
      REMINDER_CRON_SCHEDULE: "30 19 * * *"
      REMINDER_DEFAULT_TIMEZONE: "Asia/Kolkata"
      BULLMQ_CONCURRENCY: "50"
      PORT: "4000"
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      DASHBOARD_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_ADMIN_PASSWORD }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      AUTO_MOD_ENABLED: "true"
      MAX_MESSAGE_RATE_PER_3S: "5"
      MAX_QUEUE_WAIT_SECONDS: "180"
      LOG_LEVEL: "info"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --prod=false
          pnpm --dir dashboard install --frozen-lockfile --prod=false

      - name: Build TypeScript Project
        run: pnpm run build

      - name: Resolve Supabase database connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Accept either the legacy DATABASE_URL secret (now password-only)
          # or the clearer SUPABASE_DB_PASSWORD secret.
          DATABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${DATABASE_PASSWORD}" ]; then
            echo "::error::Set SUPABASE_URL, SUPABASE_ACCESS_TOKEN, and either SUPABASE_DB_PASSWORD or DATABASE_URL (password only) in GitHub Actions secrets."
            exit 1
          fi

          project_ref="$(node -e 'const u=new URL(process.env.SUPABASE_URL); const s=".supabase.co"; if(!u.hostname.endsWith(s)) throw new Error("SUPABASE_URL must be a standard Supabase project URL"); process.stdout.write(u.hostname.slice(0,-s.length));')"
          echo "Resolving the assigned Supabase pooler hostname from the Management API..."
          pooler_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${project_ref}/config/database/pooler")"

          # The pooler hostname includes a cluster index; it cannot safely be
          # guessed from the project region. Use the assigned db_host returned
          # by Supabase and force session mode (5432) for migrations.
          DATABASE_URL="$(POOLER_JSON="${pooler_json}" node -e '
            const rows=JSON.parse(process.env.POOLER_JSON);
            const list=Array.isArray(rows)?rows:(Array.isArray(rows.data)?rows.data:(Array.isArray(rows.data?.attributes)?rows.data.attributes:[]));
            const row=list.find(x=>x.db_host || x.host) || rows.data?.attributes || rows;
            const host=row.db_host || row.host;
            if(!host || !host.endsWith(".pooler.supabase.com")) throw new Error("Supabase API did not return a valid shared pooler host; check SUPABASE_ACCESS_TOKEN permissions (database_pooling_config_read).");
            const ref=new URL(process.env.SUPABASE_URL).hostname.split(".")[0];
            let password=process.env.DATABASE_PASSWORD;
            if(password.startsWith("postgres://") || password.startsWith("postgresql://")) password=decodeURIComponent(new URL(password).password);
            if(!password) throw new Error("Database password secret is empty.");
            const url=new URL("postgresql://postgres@"+host+":5432/postgres");
            url.username="postgres."+ref;
            url.password=password;
            url.searchParams.set("sslmode","require");
            process.stdout.write(url.toString());
          ')" 
          echo "::add-mask::${DATABASE_URL}"
          echo "DATABASE_URL=${DATABASE_URL}" >> "${GITHUB_ENV}"
          echo "Resolved Supabase session-pooler endpoint successfully (credentials hidden)."

      - name: Apply Supabase schema migrations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL was not generated by the connection-resolution step."
            exit 1
          fi
          # Run psql from the PostgreSQL client image instead of installing
          # packages from Ubuntu mirrors on every bot session.
          docker run --rm --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace postgres:16-alpine sh -ec '
              for migration in supabase/migrations/*.sql; do
                echo "Applying ${migration}"
                psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "${migration}"
              done
            '

      - name: Prepare Environment Configuration
        env:
          NODE_ENV: production
        run: |
          node scripts/setup-env.js
          chmod 0600 .env

      - name: Require the configured persistent Redis instance
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${REDIS_URL}" ] && [ -z "${REDIS_HOST}" ]; then
            echo "::error::Configure REDIS_URL or REDIS_HOST in repository Actions secrets. The runner no longer substitutes an ephemeral local Redis service."
            exit 1
          fi
          if [ -z "${REDIS_URL}" ] && { [ "${REDIS_HOST}" = "127.0.0.1" ] || [ "${REDIS_HOST}" = "localhost" ]; }; then
            echo "::error::REDIS_HOST must point to your persistent hosted Redis instance, not localhost."
            exit 1
          fi

      - name: Verify Redis Connection
        id: redis_check
        run: pnpm run redis:check

      - name: Run Destiny Bot Session & Publish Admin Console
        env:
          NODE_ENV: production
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
          ENABLE_ADMIN_TUNNEL: ${{ github.event_name != 'workflow_dispatch' || inputs.admin_tunnel != false }}
          # Explicitly forward dashboard credentials to the tunnel subprocess.
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          DASHBOARD_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_ADMIN_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
        run: |
          SESSION_MINUTES="${SESSION_MINUTES:-345}"
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "session_minutes must be an integer"; SESSION_MINUTES=345 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "Capping session to 350m (job limit is 360m)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "🌌 Launching Destiny bot session for ${SESSION_MINUTES}m (${seconds}s)..."

          set +e
          timeout --signal=INT --kill-after=90s "${seconds}s" pnpm start &
          bot_pid=$!
          set -e

          # -----------------------------------------------------------------
          # Admin console on a Cloudflare quick tunnel.
          #
          # `pnpm start` already serves the admin API on 127.0.0.1:4000, so the
          # tunnel only needs to run the dashboard and publish it — no second
          # API instance and no extra runner.
          # -----------------------------------------------------------------
          if [ "${ENABLE_ADMIN_TUNNEL}" = "true" ]; then
            echo "▸ starting admin console tunnel"
            bash ./scripts/start-admin-tunnel.sh --reuse-api --api-port 4000 &

            url=""
            for _ in $(seq 1 150); do
              if [ -f logs/tunnel.url ]; then
                url="$(cat logs/tunnel.url 2>/dev/null | tr -d '\r\n')"
                [ -n "${url}" ] && break
              fi
              sleep 2
            done

            if [ -n "${url}" ]; then
              echo "Admin console: ${url}"
              echo "ADMIN_TUNNEL_URL=${url}" >> "$GITHUB_OUTPUT"
              {
                echo "### 🌌 Destiny Admin Console"
                echo ""
                echo "- **URL:** ${url}"
                echo "- **Password:** value of \`DASHBOARD_ADMIN_PASSWORD\`"
                echo "- **Expires:** when this job ends (~${SESSION_MINUTES}m)"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Admin tunnel never published a URL — continuing without it."
              tail -40 logs/tunnel.log 2>/dev/null || true
            fi
          fi

          # Wait for the bot session to finish, then honour its exit status.
          set +e
          wait "${bot_pid}"
          rc=$?
          set -e

          if [ "${rc}" -eq 124 ]; then
            echo "::notice::Session window ended cleanly after ${SESSION_MINUTES}m; chaining next session..."
            exit 0
          fi
          if [ "${rc}" -eq 0 ]; then
            echo "::notice::Destiny bot process stopped cleanly; chaining next session..."
            exit 0
          fi

          echo "::warning::Destiny bot exited with status ${rc}; waiting 3m before triggering recovery..."
          sleep 180
          exit 0

      - name: Session Summary
        if: always()
        env:
          REDIS_CHECK_OUTCOME: ${{ steps.redis_check.outcome }}
        run: |
          {
            echo "### 🌌 Destiny Bot Session"
            echo ""
            echo "- **Status:** Completed window / Triggering chained successor"
            echo "- **Runner:** ${RUNNER_NAME} (GitHub Actions Ubuntu)"
            echo "- **Redis connectivity check:** ${REDIS_CHECK_OUTCOME:-not-run}"
            echo "- **Supabase:** Connected"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ -f logs/tunnel.log ]; then
            {
              echo ""
              echo "### 🔍 Tunnel diagnostics"
              echo ""
              echo '```'
              tail -20 logs/tunnel.log 2>/dev/null || echo "(no tunnel log)"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Chain Next Session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: destiny.yml
          REF: ${{ github.ref_name }}
        run: |
          queued=$(gh api "repos/${GH_REPO}/actions/workflows/${WF}/runs?status=queued" --jq '.total_count' 2>/dev/null || echo 0)
          if [ "${queued:-0}" -gt 0 ]; then
            echo "A successor session is already queued (${queued}); skipping extra dispatch."
            exit 0
          fi
          gh workflow run "${WF}" --repo "${GH_REPO}" --ref "${REF}" -f session_minutes=345
          echo "Dispatched the next session successfully."
