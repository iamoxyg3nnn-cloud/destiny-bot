name: Destiny

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes per session before chaining the next (max 350)"
        required: false
        default: "345"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI — TypeScript, tests, migrations, Docker. Runs on pushes and PRs.
  # ──────────────────────────────────────────────────────────────────────────
  checks:
    name: TypeScript and tests
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: destiny-ci-checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_ENV: test
      SUPABASE_URL: https://mock-supabase.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Validate migration script
        run: sh -n scripts/apply-migrations.sh
      - name: TypeScript build
        run: pnpm run build
      - name: Unit and integration tests
        run: pnpm test

  migrations:
    name: Supabase migration smoke test
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: destiny-ci-migrations-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: destiny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d destiny_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: destiny_test
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase roles and apply migrations
        run: |
          set -euo pipefail
          # Use the same pinned PostgreSQL client image as the service. This
          # avoids apt mirror/DNS dependencies on the hosted runner.
          docker run --rm --network host \
            -e PGPASSWORD="${PGPASSWORD}" \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGDATABASE=destiny_test \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/destiny_test" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace postgres:16-alpine sh -ec '
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
              echo "First pass: apply and record migrations"
              sh /workspace/scripts/apply-migrations.sh
              echo "Second pass: confirm every migration is skipped"
              sh /workspace/scripts/apply-migrations.sh
              applied="$(psql -Atqc "SELECT count(*) FROM destiny_internal.schema_migrations")"
              expected="$(find /workspace/supabase/migrations -maxdepth 1 -name "*.sql" | wc -l | tr -d " ")"
              test "$applied" = "$expected"
            '

  docker:
    name: Docker image builds
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: destiny-ci-docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Build bot image
        run: docker build -f docker/Dockerfile.bot -t destiny-bot:ci .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t destiny-workers:ci .
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml config >/dev/null
          rm .env

  # ──────────────────────────────────────────────────────────────────────────
  # Bot runtime — long-running session on schedule and manual dispatch only.
  # Pushes run CI exclusively; they never start or queue a bot session.
  # ──────────────────────────────────────────────────────────────────────────
  run-bot:
    name: Run Destiny Ecosystem
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: destiny-bot-runner
      # The continuation job dispatches the successor session after this one
      # completes. Never cancel an active bot session when another trigger arrives.
      cancel-in-progress: false

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      BOT_OWNER_IDS: ${{ secrets.BOT_OWNER_IDS }}
      DISCORD_SHARDS_TOTAL: "1"
      DISCORD_SHARDS_PER_CLUSTER: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMINDER_CRON_SCHEDULE: "30 19 * * *"
      REMINDER_DEFAULT_TIMEZONE: "Asia/Kolkata"
      AUTO_MOD_ENABLED: "true"
      MAX_MESSAGE_RATE_PER_3S: "5"
      MAX_QUEUE_WAIT_SECONDS: "180"
      LOG_LEVEL: "info"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --prod=false

      - name: Build TypeScript Project
        run: pnpm run build

      - name: Check required runtime secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_OWNER_IDS: ${{ secrets.BOT_OWNER_IDS }}
        run: |
          set -euo pipefail
          missing=()
          for key in DISCORD_TOKEN DISCORD_CLIENT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BOT_OWNER_IDS; do
            if [ -z "${!key:-}" ]; then missing+=("${key}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions runtime secrets: %s. Add these under Settings > Secrets and variables > Actions, then enable the bot workflows.\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          echo "Required bot runtime secrets are configured."

      - name: Prepare Environment Configuration
        env:
          NODE_ENV: production
        run: |
          node scripts/setup-env.js
          chmod 0600 .env

      - name: Run Destiny Bot Session
        env:
          NODE_ENV: production
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          SESSION_MINUTES="${SESSION_MINUTES:-345}"
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "session_minutes must be an integer"; SESSION_MINUTES=345 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "Capping session to 350m (job limit is 360m)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "🌌 Launching Destiny bot session for ${SESSION_MINUTES}m (${seconds}s)..."

          set +e
          timeout --signal=INT --kill-after=90s "${seconds}s" pnpm start &
          bot_pid=$!
          set -e

            # No web dashboard or admin API is started in this bot workflow.

          # Wait for the bot session to finish, then honour its exit status.
          set +e
          wait "${bot_pid}"
          rc=$?
          set -e

          if [ "${rc}" -eq 124 ]; then
            echo "::notice::Session window ended cleanly after ${SESSION_MINUTES}m; continuation will start the next session."
            exit 0
          fi
          if [ "${rc}" -eq 0 ]; then
            echo "::notice::Destiny bot process stopped cleanly; continuation will start the next session."
            exit 0
          fi

          echo "::error::Destiny bot exited with status ${rc}; continuation will start a recovery session."
          exit "${rc}"

      - name: Session Summary
        if: always()
        run: |
          {
            echo "### 🌌 Destiny Bot Session"
            echo ""
            echo "- **Status:** Session ended; continuation schedules the successor"
            echo "- **Runner:** ${RUNNER_NAME} (GitHub Actions Ubuntu)"
            echo "- **Runtime storage:** Supabase PostgreSQL"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ──────────────────────────────────────────────────────────────────────────
  # Session continuation — was a separate workflow only because workflow_run
  # chaining cannot live in the same file. A dependent job achieves the same
  # self-chaining behaviour with a single workflow file.
  # ──────────────────────────────────────────────────────────────────────────
  continuation:
    name: Start the next Destiny session
    needs: run-bot
    if: ${{ !cancelled() && needs.run-bot.result != 'cancelled' && needs.run-bot.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: destiny-session-continuation
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Back off after an unsuccessful session
        if: ${{ needs.run-bot.result != 'success' }}
        run: |
          echo "::warning::Previous Destiny session concluded as ${{ needs.run-bot.result }}."
          echo "Waiting 3 minutes before starting a recovery session."
          sleep 180

      - name: Dispatch the next bot session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Previous run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Previous conclusion: ${{ needs.run-bot.result }}"
          gh workflow run destiny.yml \
            --repo "${GH_REPO}" \
            --ref main \
            -f session_minutes=345
          echo "::notice::Successor session dispatch accepted by GitHub Actions."

      - name: Verify successor run was created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh run list --repo "${GH_REPO}" --workflow destiny.yml --event workflow_dispatch --branch main --limit 20 --json status --jq 'any(.[]; (.status == "queued" or .status == "in_progress"))' | grep -qx true; then
              echo "::notice::Verified that GitHub created the successor workflow run."
              exit 0
            fi
            echo "Waiting for GitHub to publish the dispatched run (attempt ${attempt}/6)..."
            sleep 5
          done
          echo "::error::Dispatch was accepted but no successor run appeared in the Actions queue."
          exit 1

      - name: Continuation summary
        if: always()
        run: |
          {
            echo "### Destiny session continuation"
            echo ""
            echo "- Previous conclusion: ${{ needs.run-bot.result }}"
            echo "- Branch: main"
            echo "- Successor: dispatch requested"
          } >> "${GITHUB_STEP_SUMMARY}"
