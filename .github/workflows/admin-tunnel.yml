# =====================================================================
# Destiny Admin Console — Cloudflare quick tunnel
# =====================================================================
#
# Publishes the admin dashboard on a temporary *.trycloudflare.com URL so it
# can be reached without opening a firewall port or owning a domain.
#
# The tunnel is EPHEMERAL: the URL changes on every run and dies with the
# job. Read it from the latest run's job summary, or:
#   gh run view --repo apunabhibhilegendhai/destiny-bot --log | grep trycloudflare
#
# The backend admin API is never published — it binds to 127.0.0.1 and the
# dashboard proxies to it server-side.

name: Destiny Admin Tunnel

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the tunnel alive (max 350)"
        required: false
        default: "345"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: destiny-admin-tunnel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-tunnel:
    name: Publish Admin Console
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_TLS: "false"
      REDIS_KEY_PREFIX: "destiny:"
      PORT: "4000"
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      DASHBOARD_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_ADMIN_PASSWORD }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --prod=false
          pnpm --dir dashboard install --frozen-lockfile --prod=false

      - name: Prepare Environment Configuration
        run: |
          node scripts/setup-env.js
          chmod 0600 .env

      - name: Open Cloudflare Tunnel & Serve Admin Console
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          set -euo pipefail

          minutes="${SESSION_MINUTES:-345}"
          case "${minutes}" in
            ''|*[!0-9]*) echo "session_minutes must be an integer"; minutes=345 ;;
          esac
          if [ "${minutes}" -gt 350 ]; then
            echo "Capping session to 350m (job limit is 360m)"
            minutes=350
          fi
          seconds=$(( minutes * 60 ))

          # Run the tunnel in the background so we can publish the URL to the
          # job summary immediately, then keep it alive for the whole window.
          # Invoked via `bash` so it works regardless of the file's exec bit.
          bash ./scripts/start-admin-tunnel.sh &
          tunnel_pid=$!

          # Wait for the tunnel to publish its URL.
          url=""
          for _ in $(seq 1 120); do
            if [ -f logs/tunnel.url ]; then
              url="$(cat logs/tunnel.url 2>/dev/null | tr -d '\r\n')"
              [ -n "${url}" ] && break
            fi
            sleep 2
          done

          if [ -z "${url}" ]; then
            echo "::error::Tunnel never published a URL"
            tail -40 logs/tunnel.log 2>/dev/null || true
            exit 1
          fi

          echo "Admin console: ${url}"
          echo "ADMIN_TUNNEL_URL=${url}" >> "$GITHUB_OUTPUT"

          {
            echo "### 🌌 Destiny Admin Console"
            echo ""
            echo "- **URL:** ${url}"
            echo "- **Password:** value of \`DASHBOARD_ADMIN_PASSWORD\`"
            echo "- **Expires:** when this job ends (~${minutes}m)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep the tunnel alive for the requested window.
          sleep "${seconds}"

      - name: Tunnel Diagnostics
        if: always()
        run: |
          {
            echo "### 🔍 Tunnel diagnostics"
            echo ""
            echo '```'
            tail -30 logs/tunnel.log 2>/dev/null || echo "(no tunnel log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
