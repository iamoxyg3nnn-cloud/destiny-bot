name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root:
    name: TypeScript and tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: https://mock-supabase.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Validate deployment and migration scripts
        run: |
          bash -n scripts/start-admin-tunnel.sh
          sh -n scripts/apply-migrations.sh
          node --check scripts/tunnel-admin.mjs
      - name: TypeScript build
        run: pnpm run build
      - name: Unit and integration tests
        run: pnpm test

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_SECRET_KEY: ci-only-api-secret-key-0123456789abcdef
      DASHBOARD_ADMIN_PASSWORD: ci-only-dashboard-password
      DASHBOARD_SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      NEXTAUTH_SECRET: ci-only-nextauth-secret-0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      BACKEND_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dashboard dependencies
        run: pnpm --dir dashboard install --frozen-lockfile --prod=false
      - name: Build dashboard
        run: pnpm --dir dashboard build

  migrations:
    name: Supabase migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: destiny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d destiny_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: destiny_test
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase roles and apply migrations
        run: |
          set -euo pipefail
          # Use the same pinned PostgreSQL client image as the service. This
          # avoids apt mirror/DNS dependencies on the hosted runner.
          docker run --rm --network host \
            -e PGPASSWORD="${PGPASSWORD}" \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGDATABASE=destiny_test \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/destiny_test" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace postgres:16-alpine sh -ec '
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
              psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
              echo "First pass: apply and record migrations"
              sh /workspace/scripts/apply-migrations.sh
              echo "Second pass: confirm every migration is skipped"
              sh /workspace/scripts/apply-migrations.sh
              psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM destiny_internal.schema_migrations"
            '

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bot image
        run: docker build -f docker/Dockerfile.bot -t destiny-bot:ci .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t destiny-workers:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t destiny-dashboard:ci .
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml config >/dev/null
          rm .env
