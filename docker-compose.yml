services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destiny-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./destiny frontend
      dockerfile: Dockerfile
    container_name: destiny-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - bot
